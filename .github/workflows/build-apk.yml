name: Build SOLIDO CLIMBING APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master, 'fix/**', 'work/**' ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Node.js for asset validation
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript assets
        run: |
          node --check app/src/main/assets/solido-coach.js
          node --check app/src/main/assets/strength-game.js
          node scripts/test-solido-coach.js
      - name: Build debug APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.11.1'
          arguments: assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SOLIDO-CLIMBING-TRAINING-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
